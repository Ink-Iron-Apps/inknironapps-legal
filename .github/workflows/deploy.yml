# Builds the Astro site and publishes it to GitHub Pages.
#
# Pages cannot run a build itself — it serves files. Before this workflow the
# repo's hand-written .html at the root WAS the site; now dist/ is, so Pages
# must be set to deploy from GitHub Actions (Settings -> Pages -> Source).
#
# books.json is committed deliberately: scripts/export_books.py reads the
# writing vault, which does not exist on a runner. Regenerate it locally and
# commit the result — never run the exporter here.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # sitemap lastmod is derived from git history; a shallow
          # clone would silently date every page the same.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro build
      - name: Fail if the build dropped a page
        # Derived from src/pages, not a literal count — adding a page raises
        # the bar on its own, so publishing a book stays a one-step change.
        run: python3 scripts/check_build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
